services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: emp
      POSTGRES_PASSWORD: emp
      POSTGRES_DB: employees
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emp -d employees"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://emp:emp@db:5432/employees
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  pgdata:
